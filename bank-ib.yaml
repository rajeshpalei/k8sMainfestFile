apiVersion: apps/v1
kind: Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-ib
  labels:
    env: bank-ib
spec:
  replicas: 2
  selector:
    matchLabels:
      env: bank-ib
  template:
    metadata:
      labels:
        env: bank-ib
    spec:
      containers:
        - name: bank-ib
          image: rajeshpalei/ib
          ports:
            - containerPort: 80
          resources:
           requests:
            cpu: "200m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ib-svc
  labels:
    env: bank-ib
spec:
  type: NodePort
  selector:
    env: bank-ib
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30456
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
 name: bank-hpa
spec:
 scaleTargetRef:
  apiVersion: apps/v1
  kind: Deployment
  name: bank-ib

 minReplicas: 3
 maxReplicas: 5
 metrics:
  - type: Resource
    resource:
     name: cpu
     target:
      type: Utilization
      averageUtilization: 20
...
